<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>HYFL 입학설명회 QR 체크인</title>
  <style>
    :root{
      --navy:#07111f;
      --navy2:#0c1b2d;
      --panel:#10243a;
      --line:rgba(255,255,255,.13);
      --text:#f8fbff;
      --muted:#a9b8ca;
      --pink:#ff316e;
      --blue:#70b4ff;
      --green:#13ad5b;
      --red:#d94357;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      color:var(--text);
      background:var(--navy);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    button{font:inherit}
    .topbar{
      height:82px;
      padding:0 38px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      background:rgba(5,14,25,.96);
    }
    .school{font-size:23px;font-weight:950;letter-spacing:-.035em}
    .event{margin-top:4px;color:var(--muted);font-size:13px;font-weight:700}
    .checkin-label{
      display:flex;
      align-items:center;
      gap:10px;
      color:#d9e5f2;
      font-size:13px;
      font-weight:900;
      letter-spacing:.16em;
    }
    .checkin-label:before{
      content:'';
      width:9px;
      height:9px;
      border-radius:50%;
      background:#42e493;
      box-shadow:0 0 15px #42e493;
    }
    .screen{
      height:calc(100vh - 82px);
      display:grid;
      grid-template-columns:58% 42%;
    }
    .count-zone{
      min-width:0;
      padding:38px 48px 36px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:
        radial-gradient(circle at 12% 10%,rgba(55,113,176,.18),transparent 38%),
        linear-gradient(145deg,#0b1b2d,#07111f);
    }
    .scan-zone{
      min-width:0;
      padding:38px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      border-left:1px solid var(--line);
      background:
        radial-gradient(circle at 50% 35%,rgba(83,158,235,.20),transparent 42%),
        linear-gradient(160deg,#102944,#09182a);
    }
    .step{
      display:flex;
      align-items:center;
      gap:10px;
      color:#c9d7e6;
      font-size:15px;
      font-weight:900;
      letter-spacing:.01em;
    }
    .step b{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--pink);
      color:#fff;
      font-size:14px;
    }
    .count-zone h1{
      margin:17px 0 27px;
      font-size:clamp(43px,5.4vw,68px);
      line-height:1.12;
      letter-spacing:-.06em;
    }
    .counts{
      width:100%;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:13px;
    }
    .count{
      height:100px;
      border:2px solid rgba(255,255,255,.15);
      border-radius:21px;
      background:rgba(255,255,255,.055);
      color:#fff;
      font-size:34px;
      font-weight:950;
      cursor:pointer;
      touch-action:manipulation;
      transition:background .16s,border-color .16s,color .16s,transform .16s;
    }
    .count:active{transform:scale(.975)}
    .count[aria-pressed="true"]{
      border-color:#fff;
      background:#fff;
      color:#07111f;
      box-shadow:0 15px 34px rgba(0,0,0,.24);
    }
    .selected{
      height:68px;
      margin-top:16px;
      padding:0 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.045);
      color:var(--muted);
      font-size:16px;
      font-weight:800;
    }
    .selected strong{
      color:#fff;
      font-size:29px;
      letter-spacing:-.04em;
    }
    .scan-zone .step{align-self:center}
    .scan-zone .step b{background:#3e93ea}
    .qr-frame{
      position:relative;
      width:190px;
      height:190px;
      margin:28px 0 25px;
      padding:25px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.34);
      border-radius:33px;
      background:rgba(255,255,255,.96);
      box-shadow:
        0 0 0 12px rgba(255,255,255,.055),
        0 25px 60px rgba(0,0,0,.31);
    }
    .qr{
      width:100%;
      height:100%;
      background:
        linear-gradient(90deg,#07111f 14%,transparent 14% 27%,#07111f 27% 41%,transparent 41% 55%,#07111f 55% 69%,transparent 69% 82%,#07111f 82%),
        linear-gradient(#07111f 14%,transparent 14% 27%,#07111f 27% 41%,transparent 41% 55%,#07111f 55% 69%,transparent 69% 82%,#07111f 82%);
      background-color:#fff;
    }
    .scan-line{
      position:absolute;
      left:17px;
      right:17px;
      top:18px;
      height:4px;
      border-radius:99px;
      background:var(--pink);
      box-shadow:0 0 16px var(--pink);
      animation:scan 2.2s ease-in-out infinite;
    }
    @keyframes scan{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(150px)}
    }
    .scan-zone h2{
      margin:0;
      font-size:clamp(34px,4.2vw,53px);
      line-height:1.1;
      letter-spacing:-.055em;
    }
    .scan-zone p{
      margin:14px 0 0;
      color:var(--muted);
      font-size:17px;
      line-height:1.55;
    }
    .auto{
      margin-top:24px;
      padding:10px 16px;
      border:1px solid rgba(112,180,255,.3);
      border-radius:999px;
      background:rgba(78,154,232,.10);
      color:#bcdcff;
      font-size:13px;
      font-weight:850;
    }
    #scanInput{
      position:fixed;
      left:-20px;
      bottom:-20px;
      width:1px;
      height:1px;
      padding:0;
      border:0;
      opacity:.001;
    }
    .overlay{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
    }
    .overlay.show{display:flex}
    .success{background:var(--green)}
    .failure{background:var(--red)}
    .mark{
      width:150px;
      height:150px;
      margin:0 auto 27px;
      display:grid;
      place-items:center;
      border:9px solid rgba(255,255,255,.95);
      border-radius:50%;
      font-size:91px;
      font-weight:750;
      line-height:1;
    }
    .overlay h2{
      margin:0;
      font-size:clamp(52px,7vw,84px);
      line-height:1.06;
      letter-spacing:-.065em;
    }
    .overlay p{
      margin:15px 0 0;
      font-size:clamp(22px,3vw,31px);
      font-weight:750;
    }
    .people-pill{
      display:inline-block;
      margin-top:25px;
      padding:12px 25px;
      border-radius:999px;
      background:rgba(255,255,255,.21);
      font-size:24px;
      font-weight:950;
    }
    @media(max-width:900px){
      .topbar{height:72px;padding:0 24px}
      .screen{height:calc(100vh - 72px);grid-template-columns:60% 40%}
      .count-zone{padding:28px}
      .scan-zone{padding:25px}
      .count-zone h1{font-size:42px;margin:12px 0 19px}
      .count{height:80px;font-size:28px}
      .selected{height:58px}
      .qr-frame{width:145px;height:145px;padding:19px;margin:19px 0}
      @keyframes scan{
        0%,100%{transform:translateY(0)}
        50%{transform:translateY(110px)}
      }
      .scan-zone h2{font-size:34px}
      .scan-zone p{font-size:15px}
    }
    @media(orientation:portrait){
      html,body{overflow:auto}
      .topbar{height:76px}
      .screen{
        height:auto;
        min-height:calc(100vh - 76px);
        grid-template-columns:1fr;
      }
      .count-zone{min-height:58vh}
      .scan-zone{min-height:42vh;border-left:0;border-top:1px solid var(--line)}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="school">한영외국어고등학교</div>
      <div class="event">2027학년도 2차 입학설명회</div>
    </div>
    <div class="checkin-label">QR CHECK-IN</div>
  </header>

  <main class="screen">
    <section class="count-zone">
      <div class="step"><b>1</b><span>입장 인원 선택</span></div>
      <h1>함께 입장하는 분은<br>몇 명인가요?</h1>

      <div class="counts">
        <button class="count" data-n="1" aria-pressed="true">1명</button>
        <button class="count" data-n="2" aria-pressed="false">2명</button>
        <button class="count" data-n="3" aria-pressed="false">3명</button>
        <button class="count" data-n="4" aria-pressed="false">4명</button>
        <button class="count" data-n="5" aria-pressed="false">5명</button>
        <button class="count" data-n="6" aria-pressed="false">6명</button>
      </div>

      <div class="selected">
        <span>선택한 입장 인원</span>
        <strong><span id="selectedCount">1</span>명</strong>
      </div>
    </section>

    <section class="scan-zone">
      <div class="step"><b>2</b><span>QR 체크인</span></div>
      <div class="qr-frame" aria-hidden="true">
        <div class="qr"></div>
        <div class="scan-line"></div>
      </div>
      <h2>QR을 스캔해 주세요</h2>
      <p>스캐너에 휴대폰의 QR을 보여주세요.</p>
      <div class="auto">스캔하면 자동으로 체크인됩니다</div>
    </section>
  </main>

  <input id="scanInput" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true">

  <section id="success" class="overlay success" aria-live="assertive">
    <div>
      <div class="mark">✓</div>
      <h2>체크인 완료!</h2>
      <p>확인되었습니다. 바로 입장해 주세요.</p>
      <div id="successPeople" class="people-pill">1명 체크인</div>
    </div>
  </section>

  <section id="failure" class="overlay failure" aria-live="assertive">
    <div>
      <div class="mark">!</div>
      <h2>다시 스캔해 주세요</h2>
      <p>QR을 확인한 뒤 다시 보여주세요.</p>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      const API = 'https://script.google.com/macros/s/AKfycbzGsYA6RRTntLKntkc61IrT6CU33TXO65LrNt-zwcbucM5njuqKJPU8HDSkHHUzB073/exec';
      const input = document.getElementById('scanInput');
      const success = document.getElementById('success');
      const failure = document.getElementById('failure');
      const successPeople = document.getElementById('successPeople');
      const selectedCount = document.getElementById('selectedCount');

      let selected = 1;
      let busy = false;
      let timer = null;
      let lastRaw = '';
      let lastAt = 0;
      let keyBuffer = '';
      let keyTimer = null;

      function focusScanner() {
        if (busy) return;
        try {
          input.focus({preventScroll:true});
        } catch (e) {
          input.focus();
        }
      }

      function setCount(value) {
        selected = value;
        selectedCount.textContent = value;
        document.querySelectorAll('.count').forEach(button => {
          button.setAttribute('aria-pressed', Number(button.dataset.n) === value ? 'true' : 'false');
        });
        focusScanner();
      }

      function resetCount() {
        setCount(1);
      }

      document.querySelectorAll('.count').forEach(button => {
        button.addEventListener('click', () => setCount(Number(button.dataset.n)));
      });

      function extractToken(raw) {
        const text = String(raw || '').trim();
        try {
          if (/^https?:/i.test(text)) {
            const url = new URL(text);
            return url.searchParams.get('token') || url.searchParams.get('t') || text;
          }
        } catch (e) {}
        return text;
      }

      function deviceId() {
        let value = '';
        try {
          value = localStorage.getItem('hyfl:scanner-test-device-id') || '';
        } catch (e) {}
        if (!value) {
          value = 'scanner-test-' + Date.now();
          try {
            localStorage.setItem('hyfl:scanner-test-device-id', value);
          } catch (e) {}
        }
        return value;
      }

      async function sendScan(token, count, raw) {
        const payload = {
          scanId: 'scanner-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
          token,
          count,
          raw,
          deviceId: deviceId(),
          clientAt: new Date().toISOString(),
          source: 'scanner-test'
        };

        const response = await fetch(API, {
          method:'POST',
          mode:'cors',
          credentials:'omit',
          headers:{'Content-Type':'text/plain;charset=UTF-8'},
          body:JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok || !data || !data.ok) throw new Error('save failed');
      }

      function showSuccess(count) {
        successPeople.textContent = count + '명 체크인';
        success.classList.add('show');
        setTimeout(() => {
          success.classList.remove('show');
          busy = false;
          resetCount();
          focusScanner();
        }, 1700);
      }

      function showFailure() {
        failure.classList.add('show');
        setTimeout(() => {
          failure.classList.remove('show');
          busy = false;
          focusScanner();
        }, 2300);
      }

      async function handleRaw(raw) {
        raw = String(raw || '').trim();
        const now = Date.now();
        if (!raw || busy) return;
        if (raw === lastRaw && now - lastAt < 900) return;

        lastRaw = raw;
        lastAt = now;
        busy = true;

        const token = extractToken(raw);
        const count = selected;

        if (!token || token.length < 3) {
          showFailure();
          return;
        }

        try {
          await sendScan(token, count, raw);
          showSuccess(count);
        } catch (error) {
          showFailure();
        }
      }

      function consumeInput() {
        clearTimeout(timer);
        const raw = input.value;
        input.value = '';
        handleRaw(raw);
      }

      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          consumeInput();
        }
      });

      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(consumeInput, 450);
      });

      function consumeKeyBuffer() {
        clearTimeout(keyTimer);
        const raw = keyBuffer;
        keyBuffer = '';
        handleRaw(raw);
      }

      document.addEventListener('keydown', event => {
        if (event.target === input || busy) return;
        if (event.key === 'Enter') {
          event.preventDefault();
          consumeKeyBuffer();
          return;
        }
        if (event.key.length === 1) {
          keyBuffer += event.key;
          clearTimeout(keyTimer);
          keyTimer = setTimeout(consumeKeyBuffer, 450);
        }
      });

      document.addEventListener('pointerdown', focusScanner);
      window.addEventListener('load', focusScanner);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') focusScanner();
      });

      focusScanner();
    })();
  </script>
</body>
</html>
