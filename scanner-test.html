<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>HYFL 입학설명회 QR 체크인</title>
  <style>
    :root{
      --bg:#07111f;
      --panel:#0e2034;
      --line:#29405b;
      --text:#f8fbff;
      --muted:#a9b9cc;
      --accent:#ff2f6d;
      --blue:#55a7ff;
      --green:#16ad5b;
      --red:#db3e52;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      background:radial-gradient(circle at 80% 0,#17345d 0,#07111f 50%);
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;
    }
    .kiosk{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:minmax(390px,42%) 1fr;
    }
    .left{
      padding:30px 34px 26px;
      background:linear-gradient(180deg,rgba(13,35,57,.98),rgba(7,22,37,.98));
      border-right:1px solid var(--line);
      display:flex;
      flex-direction:column;
    }
    .school{font-size:24px;font-weight:950;letter-spacing:-.03em}
    .event{margin-top:5px;color:var(--muted);font-size:14px;font-weight:750}
    .step{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:35px;
      color:#fff;
      font-size:18px;
      font-weight:900;
    }
    .step span{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--accent);
      font-size:17px;
    }
    h1{
      margin:14px 0 7px;
      font-size:clamp(32px,4vw,47px);
      line-height:1.1;
      letter-spacing:-.05em;
    }
    .guide{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
    .counts{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:25px;
    }
    .count{
      height:88px;
      border:2px solid var(--line);
      border-radius:20px;
      background:#0a1929;
      color:#fff;
      font-size:31px;
      font-weight:950;
      touch-action:manipulation;
    }
    .count[aria-pressed="true"]{
      border-color:#fff;
      background:#fff;
      color:#07111f;
      box-shadow:0 10px 30px rgba(0,0,0,.22);
    }
    .selected{
      margin-top:16px;
      padding:17px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(9,24,40,.75);
      color:var(--muted);
      font-size:17px;
      font-weight:800;
    }
    .selected strong{color:#fff;font-size:31px}
    .note{
      margin-top:auto;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }
    .right{
      padding:34px;
      display:grid;
      place-items:center;
    }
    .scanner-card{
      width:min(680px,95%);
      min-height:68vh;
      padding:42px 36px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      border:1px solid rgba(85,167,255,.35);
      border-radius:34px;
      background:linear-gradient(155deg,rgba(21,52,85,.9),rgba(9,24,42,.92));
      box-shadow:0 28px 70px rgba(0,0,0,.25);
    }
    .qr-icon{
      width:190px;
      height:190px;
      padding:24px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      grid-template-rows:repeat(5,1fr);
      gap:7px;
      border-radius:32px;
      background:#fff;
      box-shadow:0 0 0 13px rgba(255,255,255,.08),0 25px 55px rgba(0,0,0,.3);
    }
    .qr-icon i{background:#07111f;border-radius:3px}
    .qr-icon i:nth-child(2),
    .qr-icon i:nth-child(4),
    .qr-icon i:nth-child(7),
    .qr-icon i:nth-child(9),
    .qr-icon i:nth-child(11),
    .qr-icon i:nth-child(14),
    .qr-icon i:nth-child(18),
    .qr-icon i:nth-child(22),
    .qr-icon i:nth-child(24){background:transparent}
    .scanner-card h2{
      margin:42px 0 12px;
      font-size:clamp(31px,4vw,48px);
      line-height:1.16;
      letter-spacing:-.05em;
    }
    .scanner-card p{
      margin:0;
      color:var(--muted);
      font-size:18px;
      line-height:1.6;
    }
    .step-two{align-self:flex-start;margin:0 0 4px}
    .scanner-card h2 em{color:#ff7aa1;font-style:normal}
    .not-camera{
      margin-top:5px;
      padding:10px 17px;
      border-radius:999px;
      background:#fff2b8;
      color:#382b00;
      font-size:15px;
      font-weight:950;
    }
    .scan-visual{
      width:270px;
      margin:25px auto 17px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .phone{
      width:118px;
      height:155px;
      padding:16px;
      border:7px solid #e9f2ff;
      border-radius:20px;
      background:#12243a;
      box-shadow:0 14px 28px rgba(0,0,0,.28);
    }
    .phone:before{
      content:'';
      display:block;
      width:36px;
      height:5px;
      margin:-8px auto 15px;
      border-radius:99px;
      background:#768ba4;
    }
    .phone-qr{
      height:95px;
      border:8px solid #fff;
      background:
        linear-gradient(90deg,#07111f 13%,transparent 13% 25%,#07111f 25% 38%,transparent 38% 50%,#07111f 50% 63%,transparent 63% 75%,#07111f 75% 88%,transparent 88%),
        linear-gradient(#07111f 13%,transparent 13% 25%,#07111f 25% 38%,transparent 38% 50%,#07111f 50% 63%,transparent 63% 75%,#07111f 75% 88%,transparent 88%);
      background-color:#fff;
    }
    .down{
      height:66px;
      color:#ff5f8d;
      font-size:64px;
      font-weight:950;
      line-height:1;
      animation:point 1s ease-in-out infinite;
    }
    @keyframes point{50%{transform:translateY(7px)}}
    .scanner-device{
      position:relative;
      width:210px;
      height:85px;
      padding:15px 24px;
      border:4px solid #8ba2bb;
      border-radius:21px 21px 30px 30px;
      background:linear-gradient(#24384e,#101d2b);
      box-shadow:0 16px 28px rgba(0,0,0,.3);
    }
    .scanner-window{
      width:100%;
      height:30px;
      border:3px solid #516d88;
      border-radius:9px;
      background:#020609;
      box-shadow:inset 0 0 14px rgba(85,167,255,.32);
    }
    .scanner-light{
      width:12px;
      height:12px;
      margin:7px auto 0;
      border-radius:50%;
      background:#36e491;
      box-shadow:0 0 12px #36e491;
    }
    .final-guide{
      margin-top:25px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:15px 20px;
      border-radius:17px;
      background:rgba(22,173,91,.18);
      border:1px solid rgba(75,232,142,.45);
      color:#c9ffe0;
      font-size:18px;
    }
    .final-guide span{
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      flex:none;
      border-radius:50%;
      background:var(--green);
      color:#fff;
      font-weight:950;
    }
    #scanInput{
      position:fixed;
      left:-20px;
      bottom:-20px;
      width:1px;
      height:1px;
      opacity:.001;
      border:0;
      padding:0;
    }
    .overlay{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
    }
    .overlay.show{display:flex}
    .success{background:var(--green)}
    .failure{background:var(--red)}
    .mark{
      width:150px;
      height:150px;
      margin:0 auto 25px;
      display:grid;
      place-items:center;
      border:9px solid rgba(255,255,255,.95);
      border-radius:50%;
      font-size:94px;
      font-weight:700;
      line-height:1;
    }
    .overlay h2{
      margin:0;
      font-size:clamp(50px,7vw,82px);
      letter-spacing:-.055em;
    }
    .overlay p{
      margin:15px 0 0;
      font-size:clamp(21px,3vw,31px);
      font-weight:750;
    }
    .people-pill{
      display:inline-block;
      margin-top:24px;
      padding:12px 24px;
      border-radius:999px;
      background:rgba(255,255,255,.2);
      font-size:24px;
      font-weight:900;
    }
    /* 현장용 최소 화면: 질문과 인원 선택만 표시 */
    .kiosk{
      display:grid;
      place-items:center;
      padding:28px;
    }
    .left{
      width:min(900px,100%);
      min-height:auto;
      padding:38px 48px 46px;
      border:1px solid var(--line);
      border-radius:32px;
      background:linear-gradient(155deg,rgba(16,43,69,.98),rgba(7,24,40,.98));
      box-shadow:0 28px 70px rgba(0,0,0,.28);
      text-align:center;
    }
    .left header{margin-bottom:31px}
    .school{font-size:27px}
    .event{font-size:15px}
    .left h1{
      margin:0 0 30px;
      font-size:clamp(44px,6vw,70px);
      line-height:1.12;
    }
    .left .counts{
      width:min(720px,100%);
      margin:0 auto;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
    }
    .left .count{
      height:105px;
      font-size:36px;
    }
    .left .selected{
      width:min(720px,100%);
      margin:18px auto 0;
      justify-content:center;
      gap:18px;
      font-size:19px;
    }
    .right{display:none}

    @media(max-width:800px){
      .kiosk{grid-template-columns:1fr 1.18fr}
      .left{padding:22px}
      .counts{gap:8px}
      .count{height:70px;font-size:31px}
      .right{padding:20px}
      .scanner-card{width:100%;min-height:75vh;padding:28px 20px}
      .qr-icon{width:145px;height:145px;padding:18px;gap:5px}
      .scanner-card h2{margin-top:30px}
    }
    @media(orientation:portrait){
      html,body{overflow:auto}
      .kiosk{height:auto;min-height:100%;grid-template-columns:1fr}
      .left{min-height:52vh}
      .right{min-height:48vh;padding:22px}
      .scanner-card{min-height:42vh}
      .qr-icon{width:125px;height:125px}
    }
  </style>
</head>
<body>
  <main class="kiosk">
    <section class="left">
      <header>
        <div class="school">한영외국어고등학교</div>
        <div class="event">2027학년도 2차 입학설명회</div>
      </header>

      <h1>함께 입장하는 분은<br>몇 명인가요?</h1>

      <div class="counts" id="countButtons">
        <button class="count" data-n="1" aria-pressed="true">1명</button>
        <button class="count" data-n="2" aria-pressed="false">2명</button>
        <button class="count" data-n="3" aria-pressed="false">3명</button>
        <button class="count" data-n="4" aria-pressed="false">4명</button>
        <button class="count" data-n="5" aria-pressed="false">5명</button>
        <button class="count" data-n="6" aria-pressed="false">6명</button>
      </div>

      <div class="selected">
        <span>현재</span>
        <span><strong id="selectedCount">1</strong>명 선택</span>
      </div>
    </section>

  </main>

  <input id="scanInput" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true">

  <section id="success" class="overlay success" aria-live="assertive">
    <div>
      <div class="mark">✓</div>
      <h2>체크인 완료!</h2>
      <p>확인되었습니다. 바로 입장해 주세요.</p>
      <div id="successPeople" class="people-pill">1명 입장</div>
    </div>
  </section>

  <section id="failure" class="overlay failure" aria-live="assertive">
    <div>
      <div class="mark">!</div>
      <h2>다시 확인해 주세요</h2>
      <p id="failureMessage">QR을 다시 스캔해 주세요.</p>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      const API = 'https://script.google.com/macros/s/AKfycbzGsYA6RRTntLKntkc61IrT6CU33TXO65LrNt-zwcbucM5njuqKJPU8HDSkHHUzB073/exec';
      const input = document.getElementById('scanInput');
      const success = document.getElementById('success');
      const failure = document.getElementById('failure');
      const failureMessage = document.getElementById('failureMessage');
      const successPeople = document.getElementById('successPeople');
      const selectedCount = document.getElementById('selectedCount');

      let selected = 1;
      let busy = false;
      let timer = null;
      let lastRaw = '';
      let lastAt = 0;

      function focusScanner() {
        if (busy) return;
        setTimeout(() => {
          try {
            input.focus({preventScroll:true});
          } catch (e) {
            input.focus();
          }
        }, 40);
      }

      function setCount(value) {
        selected = value;
        selectedCount.textContent = value;
        document.querySelectorAll('.count').forEach(button => {
          button.setAttribute('aria-pressed', Number(button.dataset.n) === value ? 'true' : 'false');
        });
        focusScanner();
      }

      function resetCount() {
        setCount(1);
      }

      document.querySelectorAll('.count').forEach(button => {
        button.addEventListener('click', () => setCount(Number(button.dataset.n)));
      });

      function extractToken(raw) {
        const text = String(raw || '').trim();
        try {
          if (/^https?:/i.test(text)) {
            const url = new URL(text);
            return url.searchParams.get('token') || url.searchParams.get('t') || text;
          }
        } catch (e) {}
        return text;
      }

      function deviceId() {
        let value = '';
        try {
          value = localStorage.getItem('hyfl:scanner-test-device-id') || '';
        } catch (e) {}
        if (!value) {
          value = 'scanner-test-' + Date.now();
          try {
            localStorage.setItem('hyfl:scanner-test-device-id', value);
          } catch (e) {}
        }
        return value;
      }

      async function sendScan(token, count, raw) {
        const payload = {
          scanId: 'scanner-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
          token,
          count,
          raw,
          deviceId: deviceId(),
          clientAt: new Date().toISOString(),
          source: 'scanner-test'
        };

        const response = await fetch(API, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          headers: {'Content-Type':'text/plain;charset=UTF-8'},
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok || !data || !data.ok) {
          throw new Error((data && data.msg) || '체크인 처리에 실패했습니다.');
        }
        return data;
      }

      function showSuccess(count) {
        successPeople.textContent = count + '명 입장';
        success.classList.add('show');
        setTimeout(() => {
          success.classList.remove('show');
          busy = false;
          resetCount();
          focusScanner();
        }, 1700);
      }

      function showFailure(message) {
        failureMessage.textContent = message || 'QR을 다시 스캔해 주세요.';
        failure.classList.add('show');
        setTimeout(() => {
          failure.classList.remove('show');
          busy = false;
          focusScanner();
        }, 2400);
      }

      async function handleRaw(raw) {
        raw = String(raw || '').trim();
        const now = Date.now();
        if (!raw || busy) return;
        if (raw === lastRaw && now - lastAt < 900) return;

        lastRaw = raw;
        lastAt = now;
        busy = true;

        const token = extractToken(raw);
        const count = selected;

        if (!token || token.length < 3) {
          showFailure('QR을 다시 스캔해 주세요.');
          return;
        }

        try {
          await sendScan(token, count, raw);
          showSuccess(count);
        } catch (error) {
          showFailure(error && error.message ? error.message : 'QR을 다시 스캔해 주세요.');
        }
      }

      function consume() {
        clearTimeout(timer);
        const raw = input.value;
        input.value = '';
        handleRaw(raw);
      }

      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          consume();
        }
      });

      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(consume, 450);
      });

      document.addEventListener('pointerup', event => {
        if (!event.target.closest('.overlay')) focusScanner();
      });
      window.addEventListener('load', focusScanner);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') focusScanner();
      });

      focusScanner();
    })();
  </script>
</body>
</html>
