<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HYFL 체크인">
  <meta name="application-name" content="HYFL 체크인">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#087d62">
  <title>HYFL 입학설명회 QR 체크인</title>
  <style>
    :root{
      --green:#087d62;
      --green2:#0a9a74;
      --green-soft:#e9f6f1;
      --ink:#14251f;
      --muted:#708079;
      --line:#dce7e2;
      --paper:#f3f7f5;
      --white:#fff;
      --success:#13ad5b;
      --error:#d94357;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      background:var(--paper);
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    button{font:inherit}
    .shell{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:var(--paper);
    }
    .hero{
      position:relative;
      min-height:174px;
      padding:27px 28px 25px;
      overflow:hidden;
      color:#fff;
      background:linear-gradient(135deg,#066f58 0%,#0b9771 100%);
    }
    .hero:before,.hero:after{
      content:'';
      position:absolute;
      border-radius:28px;
      background:rgba(255,255,255,.09);
      transform:rotate(28deg);
    }
    .hero:before{width:125px;height:125px;right:-22px;top:-43px}
    .hero:after{width:82px;height:82px;right:90px;bottom:-47px}
    .hero-top{
      position:relative;
      z-index:1;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:15px;
    }
    .school{font-size:19px;font-weight:950;letter-spacing:-.035em}
    .event{margin-top:4px;color:rgba(255,255,255,.76);font-size:12px;font-weight:750}
    .hero h1{
      position:relative;
      z-index:1;
      margin:28px 0 0;
      font-size:34px;
      line-height:1.12;
      letter-spacing:-.055em;
    }
    .hero h1 small{
      display:block;
      margin-bottom:7px;
      color:#bdf3df;
      font-size:12px;
      font-weight:900;
      letter-spacing:.16em;
    }
    .top-actions{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .live-total{
      height:43px;
      padding:0 12px;
      display:flex;
      align-items:center;
      gap:6px;
      border:1px solid rgba(255,255,255,.24);
      border-radius:13px;
      background:rgba(0,0,0,.10);
      backdrop-filter:blur(7px);
    }
    .live-total span{font-size:10px;font-weight:800;color:rgba(255,255,255,.73)}
    .live-total strong{font-size:22px;line-height:1}
    .live-total em{font-size:11px;font-style:normal;font-weight:800}
    .dashboard-link{
      width:43px;
      height:43px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.24);
      border-radius:13px;
      background:rgba(0,0,0,.10);
      color:#fff;
      text-decoration:none;
      font-size:18px;
      font-weight:950;
    }
    .content{
      flex:1;
      min-height:0;
      padding:21px 23px 22px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .section-label{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--green);
      font-size:11px;
      font-weight:950;
      letter-spacing:.11em;
    }
    .section-label b{
      width:25px;
      height:25px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--green);
      color:#fff;
      font-size:11px;
      letter-spacing:0;
    }
    .people h2{
      margin:10px 0 15px;
      font-size:28px;
      line-height:1.16;
      letter-spacing:-.055em;
    }
    .counts{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
    }
    .count{
      height:65px;
      border:1.5px solid var(--line);
      border-radius:15px;
      background:#fff;
      color:#20322b;
      font-size:21px;
      font-weight:950;
      box-shadow:0 5px 15px rgba(29,76,59,.045);
      touch-action:manipulation;
      transition:.15s ease;
    }
    .count:active{transform:scale(.975)}
    .count[aria-pressed="true"]{
      border-color:var(--green);
      background:var(--green);
      color:#fff;
      box-shadow:0 9px 20px rgba(8,125,98,.22);
    }
    .selected{
      height:47px;
      margin-top:10px;
      padding:0 15px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-radius:13px;
      background:var(--green-soft);
      color:#567068;
      font-size:13px;
      font-weight:800;
    }
    .selected strong{color:var(--green);font-size:20px}
    .scan-card{
      flex:1;
      min-height:280px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:21px;
      background:#fff;
      box-shadow:0 16px 38px rgba(30,70,55,.09);
    }
    .scan-bar{
      height:38px;
      display:grid;
      place-items:center;
      flex:none;
      background:var(--green2);
      color:#fff;
      font-size:11px;
      font-weight:950;
      letter-spacing:.18em;
    }
    .scan-body{
      flex:1;
      min-height:0;
      padding:20px 24px 22px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
    }
    .scan-graphic{
      position:relative;
      width:106px;
      height:106px;
      display:grid;
      place-items:center;
      border-radius:26px;
      background:var(--green-soft);
    }
    .scan-graphic svg{width:72px;height:72px}
    .scan-pulse{
      position:absolute;
      inset:-7px;
      border:2px solid rgba(10,154,116,.22);
      border-radius:31px;
      animation:pulse 1.8s ease-out infinite;
    }
    @keyframes pulse{
      0%{transform:scale(.92);opacity:0}
      35%{opacity:1}
      100%{transform:scale(1.12);opacity:0}
    }
    .scan-body h2{
      margin:20px 0 8px;
      font-size:26px;
      line-height:1.15;
      letter-spacing:-.055em;
    }
    .scan-body p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .ready{
      margin-top:16px;
      display:inline-flex;
      align-items:center;
      gap:7px;
      color:var(--green);
      font-size:12px;
      font-weight:900;
    }
    .ready:before{
      content:'';
      width:8px;
      height:8px;
      border-radius:50%;
      background:#25c98b;
      box-shadow:0 0 10px #25c98b;
    }
    #scanInput{
      position:fixed;
      left:-20px;
      bottom:-20px;
      width:1px;
      height:1px;
      padding:0;
      border:0;
      opacity:.001;
    }
    .overlay{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      justify-content:center;
      padding:30px;
      text-align:center;
      color:#fff;
    }
    .overlay.show{display:flex}
    .success{background:var(--success)}
    .failure{background:var(--error)}
    .mark{
      width:138px;
      height:138px;
      margin:0 auto 25px;
      display:grid;
      place-items:center;
      border:8px solid rgba(255,255,255,.95);
      border-radius:50%;
      font-size:83px;
      font-weight:750;
      line-height:1;
    }
    .overlay h2{
      margin:0;
      font-size:54px;
      line-height:1.07;
      letter-spacing:-.065em;
    }
    .overlay p{
      margin:14px 0 0;
      font-size:21px;
      font-weight:750;
    }
    .people-pill{
      display:inline-block;
      margin-top:23px;
      padding:11px 23px;
      border-radius:999px;
      background:rgba(255,255,255,.21);
      font-size:21px;
      font-weight:950;
    }
    @media(orientation:landscape) and (min-width:800px){
      .hero{min-height:118px;padding:20px 31px}
      .hero h1{margin-top:15px;font-size:27px}
      .content{
        display:grid;
        grid-template-columns:1.04fr .96fr;
        align-items:stretch;
        padding:23px 28px 26px;
      }
      .people{
        display:flex;
        flex-direction:column;
        justify-content:center;
        padding:5px 7px;
      }
      .people h2{font-size:36px;margin:13px 0 20px}
      .count{height:82px;font-size:27px}
      .selected{height:58px;margin-top:13px}
      .scan-card{min-height:0}
      .scan-body h2{font-size:31px}
    }
    @media(max-height:780px) and (orientation:portrait){
      .hero{min-height:143px;padding:21px 24px}
      .hero h1{margin-top:19px;font-size:29px}
      .content{padding:15px 19px;gap:12px}
      .people h2{font-size:24px;margin:7px 0 10px}
      .count{height:54px;font-size:19px}
      .selected{height:41px;margin-top:7px}
      .scan-card{min-height:225px}
      .scan-body{padding:13px 20px}
      .scan-graphic{width:83px;height:83px}
      .scan-graphic svg{width:56px;height:56px}
      .scan-body h2{margin-top:13px;font-size:23px}
      .ready{margin-top:10px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-top">
        <div>
          <div class="school">한영외국어고등학교</div>
          <div class="event">2027학년도 입학설명회</div>
        </div>
        <div class="top-actions">
          <div class="live-total">
            <span>현재 입장</span>
            <strong id="totalPeople">-</strong>
            <em>명</em>
          </div>
          <a class="dashboard-link" href="dashboard.html" target="_blank" rel="noopener" aria-label="실시간 현황">↗</a>
        </div>
      </div>
      <h1><small>WELCOME TO HYFL</small>입학설명회 QR 체크인</h1>
    </header>

    <div class="content">
      <section class="people">
        <div class="section-label"><b>1</b>입장 인원 선택</div>
        <h2>함께 입장하는 분은<br>몇 명인가요?</h2>

        <div class="counts">
          <button class="count" data-n="1" aria-pressed="true">1명</button>
          <button class="count" data-n="2" aria-pressed="false">2명</button>
          <button class="count" data-n="3" aria-pressed="false">3명</button>
          <button class="count" data-n="4" aria-pressed="false">4명</button>
          <button class="count" data-n="5" aria-pressed="false">5명</button>
          <button class="count" data-n="6" aria-pressed="false">6명</button>
        </div>

        <div class="selected">
          <span>선택한 입장 인원</span>
          <strong><span id="selectedCount">1</span>명</strong>
        </div>
      </section>

      <section class="scan-card">
        <div class="scan-bar">QR SCAN</div>
        <div class="scan-body">
          <div class="scan-graphic" aria-hidden="true">
            <div class="scan-pulse"></div>
            <svg viewBox="0 0 96 96" fill="none">
              <rect x="21" y="10" width="54" height="76" rx="10" fill="white" stroke="#087d62" stroke-width="4"/>
              <rect x="31" y="24" width="34" height="34" rx="4" fill="#087d62"/>
              <path d="M36 29h9v9h-9zM51 29h9v9h-9zM36 44h9v9h-9zM50 43h5v5h-5zM56 49h5v5h-5z" fill="white"/>
              <rect x="41" y="71" width="14" height="4" rx="2" fill="#087d62"/>
            </svg>
          </div>
          <h2>QR 코드를 인식해 주세요</h2>
          <p>옆에 놓인 스캐너에<br>휴대폰의 QR 코드를 보여주세요.</p>
          <div class="ready">스캔 준비 완료</div>
        </div>
      </section>
    </div>
  </main>

  <input id="scanInput" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true">

  <section id="success" class="overlay success" aria-live="assertive">
    <div>
      <div class="mark">✓</div>
      <h2>체크인 완료!</h2>
      <p>확인되었습니다. 바로 입장해 주세요.</p>
      <div id="successPeople" class="people-pill">1명 체크인</div>
    </div>
  </section>

  <section id="failure" class="overlay failure" aria-live="assertive">
    <div>
      <div class="mark">!</div>
      <h2>다시 스캔해 주세요</h2>
      <p>QR을 확인한 뒤 다시 보여주세요.</p>
    </div>
  </section>

<script>
    (() => {
      'use strict';

      const API = 'https://script.google.com/macros/s/AKfycbzGsYA6RRTntLKntkc61IrT6CU33TXO65LrNt-zwcbucM5njuqKJPU8HDSkHHUzB073/exec';
      const input = document.getElementById('scanInput');
      const success = document.getElementById('success');
      const failure = document.getElementById('failure');
      const successPeople = document.getElementById('successPeople');
      const selectedCount = document.getElementById('selectedCount');
      const totalPeople = document.getElementById('totalPeople');

      let selected = 1;
      let busy = false;
      let timer = null;
      let lastRaw = '';
      let lastAt = 0;
      let keyBuffer = '';
      let keyTimer = null;
      let refreshingTotal = false;

      function focusScanner() {
        if (busy) return;
        try {
          input.focus({preventScroll:true});
        } catch (e) {
          input.focus();
        }
      }

      function setCount(value) {
        selected = value;
        selectedCount.textContent = value;
        document.querySelectorAll('.count').forEach(button => {
          button.setAttribute('aria-pressed', Number(button.dataset.n) === value ? 'true' : 'false');
        });
        focusScanner();
      }

      function resetCount() {
        setCount(1);
      }

      document.querySelectorAll('.count').forEach(button => {
        button.addEventListener('click', () => setCount(Number(button.dataset.n)));
      });

      function extractToken(raw) {
        const text = String(raw || '').trim();
        try {
          if (/^https?:/i.test(text)) {
            const url = new URL(text);
            return url.searchParams.get('token') || url.searchParams.get('t') || text;
          }
        } catch (e) {}
        return text;
      }

      function deviceId() {
        let value = '';
        try {
          value = localStorage.getItem('hyfl:scanner-test-device-id') || '';
        } catch (e) {}
        if (!value) {
          value = 'scanner-test-' + Date.now();
          try {
            localStorage.setItem('hyfl:scanner-test-device-id', value);
          } catch (e) {}
        }
        return value;
      }

      async function refreshTotal() {
        if (refreshingTotal) return;
        refreshingTotal = true;
        try {
          const response = await fetch(API + '?action=dashboard&_=' + Date.now(), {cache:'no-store'});
          const data = await response.json();
          if (!data || !data.ok) throw new Error('dashboard failed');
          const value = Number(
            data.totalAttendedPeople ??
            data.attendedPeople ??
            data.checkedPeople ??
            data.checkedRegistrations
          );
          if (Number.isFinite(value)) totalPeople.textContent = value.toLocaleString('ko-KR');
        } catch (error) {
          totalPeople.textContent = '-';
        } finally {
          refreshingTotal = false;
        }
      }

      async function sendScan(token, count, raw) {
        const payload = {
          scanId: 'scanner-' + Date.now() + '-' + Math.random().toString(36).slice(2,7),
          token,
          count,
          raw,
          deviceId: deviceId(),
          clientAt: new Date().toISOString(),
          source: 'scanner-test'
        };

        const response = await fetch(API, {
          method:'POST',
          mode:'cors',
          credentials:'omit',
          headers:{'Content-Type':'text/plain;charset=UTF-8'},
          body:JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok || !data || !data.ok) throw new Error('save failed');
      }

      function showSuccess(count) {
        successPeople.textContent = count + '명 체크인';
        success.classList.add('show');
        setTimeout(() => {
          success.classList.remove('show');
          busy = false;
          resetCount();
          focusScanner();
        }, 1700);
      }

      function showFailure() {
        failure.classList.add('show');
        setTimeout(() => {
          failure.classList.remove('show');
          busy = false;
          focusScanner();
        }, 2300);
      }

      async function handleRaw(raw) {
        raw = String(raw || '').trim();
        const now = Date.now();
        if (!raw || busy) return;
        if (raw === lastRaw && now - lastAt < 900) return;

        lastRaw = raw;
        lastAt = now;
        busy = true;

        const token = extractToken(raw);
        const count = selected;

        if (!token || token.length < 3) {
          showFailure();
          return;
        }

        try {
          await sendScan(token, count, raw);
          showSuccess(count);
          setTimeout(refreshTotal, 300);
          setTimeout(refreshTotal, 1000);
        } catch (error) {
          showFailure();
        }
      }

      function consumeInput() {
        clearTimeout(timer);
        const raw = input.value;
        input.value = '';
        handleRaw(raw);
      }

      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          consumeInput();
        }
      });

      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(consumeInput, 450);
      });

      function consumeKeyBuffer() {
        clearTimeout(keyTimer);
        const raw = keyBuffer;
        keyBuffer = '';
        handleRaw(raw);
      }

      document.addEventListener('keydown', event => {
        if (event.target === input || busy) return;
        if (event.key === 'Enter') {
          event.preventDefault();
          consumeKeyBuffer();
          return;
        }
        if (event.key.length === 1) {
          keyBuffer += event.key;
          clearTimeout(keyTimer);
          keyTimer = setTimeout(consumeKeyBuffer, 450);
        }
      });

      document.addEventListener('pointerdown', focusScanner);
      window.addEventListener('load', () => {
        focusScanner();
        refreshTotal();
      });
      setInterval(refreshTotal, 3000);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') focusScanner();
      });

      focusScanner();
    })();
  </script>
</body>
</html>
