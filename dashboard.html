<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>2차 입학설명회 현장 대시보드</title>
  <style>
    :root{--bg:#07111f;--card:#102036;--line:#203550;--text:#f4f8ff;--muted:#93a7bf;--blue:#4da3ff;--green:#3ddc97;--orange:#ffb454;--red:#ff6b78}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#0b1829);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
    h1{font-size:clamp(22px,4vw,34px);margin:0 0 7px}.sub,.stamp{color:var(--muted);font-size:14px}.back{color:#fff;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:11px 14px;white-space:nowrap}
    .status{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(16,32,54,.9);border:1px solid var(--line);border-radius:18px;padding:19px}
    .label{color:var(--muted);font-size:13px;font-weight:700}.value{font-size:clamp(28px,4vw,44px);font-weight:900;margin-top:8px;letter-spacing:-1.5px}.unit{font-size:15px;color:var(--muted);margin-left:4px}
    .green{color:var(--green)}.blue{color:var(--blue)}.orange{color:var(--orange)}.red{color:var(--red)}
    .grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:14px}.panel{background:rgba(16,32,54,.9);border:1px solid var(--line);border-radius:18px;padding:19px}
    .panel h2{font-size:17px;margin:0 0 16px}.progress{height:16px;background:#091525;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s}
    .progress-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-top:9px}.chart{height:180px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line);padding-top:15px}
    .chart-bar{flex:1;min-width:3px;background:linear-gradient(180deg,var(--blue),#2365a7);border-radius:4px 4px 0 0;opacity:.9}
    .recent{display:grid;gap:8px}.row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}.row:last-child{border:0}
    .time{color:var(--muted);font-variant-numeric:tabular-nums}.pill{padding:4px 9px;border-radius:99px;background:rgba(61,220,151,.12);color:var(--green);font-weight:800}
    .issues{display:grid;grid-template-columns:1fr 1fr;gap:10px}.issue{background:#091525;border-radius:14px;padding:14px}.issue strong{font-size:24px;display:block;margin-top:5px}
    .errorbox{display:none;margin:14px 0;background:rgba(255,107,120,.13);border:1px solid rgba(255,107,120,.45);border-radius:14px;padding:14px;color:#ffd5da}
    @media(max-width:820px){main{padding:16px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:center}.stamp{display:none}}
    @media(max-width:430px){.cards{gap:9px}.card{padding:15px}.value{font-size:30px}.back{padding:10px 12px}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>현장 체크인 대시보드</h1><div class="sub">2027학년도 2차 입학설명회 · <span class="status"><span class="dot"></span><span id="status">자동 갱신 중</span></span></div></div>
    <a class="back" href="index.html">체크인 화면</a>
  </div>
  <div id="error" class="errorbox"></div>
  <section class="cards">
    <article class="card"><div class="label">현재 입장 인원</div><div class="value green"><span id="checkedPeople">-</span><span class="unit">명</span></div></article>
    <article class="card"><div class="label">체크인 신청 건</div><div class="value blue"><span id="checkedRegs">-</span><span class="unit">건</span></div></article>
    <article class="card"><div class="label">예상 참석 인원</div><div class="value"><span id="expectedPeople">-</span><span class="unit">명</span></div></article>
    <article class="card"><div class="label">아직 미입장</div><div class="value orange"><span id="remaining">-</span><span class="unit">건</span></div></article>
  </section>
  <section class="grid">
    <div class="panel">
      <h2>입장 현황</h2>
      <div class="progress"><div id="progressBar" class="bar"></div></div>
      <div class="progress-meta"><span id="rate">입장률 -</span><span id="regTotal">전체 신청 -건</span></div>
      <h2 style="margin-top:26px">시간대별 입장 인원</h2>
      <div id="chart" class="chart"></div>
    </div>
    <div class="panel">
      <h2>운영 확인</h2>
      <div class="issues">
        <div class="issue"><span class="label">중복 스캔</span><strong id="duplicates" class="orange">-</strong></div>
        <div class="issue"><span class="label">미등록 QR</span><strong id="invalid" class="red">-</strong></div>
      </div>
      <div class="sub" style="margin-top:14px">마지막 입장: <span id="lastScan">-</span></div>
      <div class="stamp" style="margin-top:7px">갱신: <span id="updated">-</span></div>
    </div>
  </section>
  <section class="panel" style="margin-top:14px">
    <h2>최근 입장</h2><div id="recent" class="recent"><div class="sub">입장 기록을 기다리는 중입니다.</div></div>
  </section>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbzGsYA6RRTntLKntkc61IrT6CU33TXO65LrNt-zwcbucM5njuqKJPU8HDSkHHUzB073/exec';
const el=id=>document.getElementById(id);
const n=v=>Number(v||0).toLocaleString('ko-KR');
const time=v=>{if(!v)return '-';const d=new Date(v);return isNaN(d)?'-':d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});};
function render(d){
  el('checkedPeople').textContent=n(d.checkedPeople);el('checkedRegs').textContent=n(d.checkedRegistrations);
  el('expectedPeople').textContent=n(d.expectedPeople);el('remaining').textContent=n(d.remainingRegistrations);
  el('duplicates').textContent=n(d.duplicateScans);el('invalid').textContent=n(d.invalidScans);
  el('rate').textContent='입장률 '+n(d.attendanceRate)+'%';el('regTotal').textContent='전체 신청 '+n(d.registrations)+'건';
  el('progressBar').style.width=Math.min(100,Number(d.attendanceRate||0))+'%';
  el('lastScan').textContent=time(d.lastScanAt);el('updated').textContent=time(d.updatedAt);
  const recent=Array.isArray(d.recent)?d.recent:[];
  el('recent').innerHTML=recent.length?recent.map(x=>'<div class="row"><span class="time">'+time(x.time)+'</span><span>'+String(x.name||'신청자')+'</span><span class="pill">'+n(x.count)+'명</span></div>').join(''):'<div class="sub">입장 기록을 기다리는 중입니다.</div>';
  const items=Array.isArray(d.timeline)?d.timeline.slice(-40):[];const max=Math.max(1,...items.map(x=>Number(x.count||0)));
  el('chart').innerHTML=items.length?items.map(x=>'<div class="chart-bar" title="'+x.time+' · '+n(x.count)+'명" style="height:'+Math.max(4,Math.round(Number(x.count||0)/max*100))+'%"></div>').join(''):'<div class="sub">아직 표시할 데이터가 없습니다.</div>';
  el('error').style.display='none';el('status').textContent='자동 갱신 중';
}
async function refresh(){
  try{const r=await fetch(API+'?action=dashboard&_='+Date.now(),{cache:'no-store'});const d=await r.json();if(!d.ok)throw new Error(d.msg||'집계 오류');render(d);}
  catch(e){el('error').style.display='block';el('error').textContent='대시보드 데이터를 불러오지 못했습니다. Apps Script 최신 코드를 배포했는지 확인해 주세요.';el('status').textContent='연결 확인 필요';}
}
refresh();setInterval(refresh,12000);
</script>
</body></html>
