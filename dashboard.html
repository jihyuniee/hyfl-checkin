<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>2차 입학설명회 실시간 대시보드</title>
  <style>
    :root{--navy:#172554;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--bg:#f4f7fb;--line:#e2e8f0;--muted:#64748b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    .wrap{max-width:1280px;margin:auto;padding:28px}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
    h1{margin:4px 0 0;font-size:clamp(25px,3vw,38px);letter-spacing:-.04em}.eyebrow{font-weight:800;color:var(--blue);font-size:13px}.updated{color:var(--muted);font-size:14px;text-align:right}
    .status{display:inline-flex;align-items:center;gap:7px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}.status.ok .dot{background:var(--green);box-shadow:0 0 0 4px #dcfce7}.status.bad .dot{background:var(--red)}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.05)}
    .card{padding:22px}.label{font-size:13px;font-weight:800;color:var(--muted)}.value{font-size:clamp(32px,4vw,50px);font-weight:900;letter-spacing:-.05em;margin-top:9px}.unit{font-size:16px;margin-left:4px;color:var(--muted)}
    .main{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}.panel{padding:24px}.panel h2{font-size:18px;margin:0 0 18px}
    .progress{height:22px;border-radius:999px;background:#e8eef8;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#22c55e);transition:width .5s}.progress-row{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:14px}.rate{font-weight:900;color:var(--blue)}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 6px;border-bottom:1px solid #eef2f7;font-size:14px}th{color:var(--muted);font-size:12px}td:last-child,th:last-child{text-align:right}.empty{padding:28px;text-align:center;color:var(--muted)}
    .note{margin-top:16px;padding:14px 16px;border-radius:12px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.55}
    @media(max-width:850px){.wrap{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.updated{text-align:left}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><div class="eyebrow">한영외국어고등학교</div><h1>2027학년도 2차 입학설명회</h1></div>
      <div class="updated"><span class="status" id="status"><span class="dot"></span><span>연결 중</span></span><br><span id="updated">-</span></div>
    </header>
    <section class="cards">
      <article class="card"><div class="label">신청 건수</div><div class="value"><span id="registrations">-</span><span class="unit">건</span></div></article>
      <article class="card"><div class="label">신청 예정 인원</div><div class="value"><span id="expected">-</span><span class="unit">명</span></div></article>
      <article class="card"><div class="label">현재 입장 인원</div><div class="value" style="color:var(--green)"><span id="checkedPeople">-</span><span class="unit">명</span></div></article>
      <article class="card"><div class="label">미체크인 신청</div><div class="value" style="color:var(--amber)"><span id="remaining">-</span><span class="unit">건</span></div></article>
    </section>
    <section class="main">
      <article class="panel">
        <h2>체크인 진행률</h2>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="progress-row"><span><b id="checkedRegistrations">-</b>건 체크인</span><span class="rate" id="rate">-%</span></div>
        <div class="note">신청 건수 기준 진행률입니다. 입장 인원은 현장에서 선택한 실제 입장 인원의 합계로 표시됩니다.</div>
      </article>
      <article class="panel">
        <h2>최근 체크인</h2>
        <div id="recent"><div class="empty">아직 체크인 기록이 없습니다.</div></div>
      </article>
    </section>
  </div>
  <script>
    const API='https://script.google.com/macros/s/AKfycbzGsYA6RRTntLKntkc61IrT6CU33TXO65LrNt-zwcbucM5njuqKJPU8HDSkHHUzB073/exec';
    const el=id=>document.getElementById(id); const nf=n=>(Number(n)||0).toLocaleString('ko-KR');
    function timeText(value){const d=new Date(value);return isNaN(d)?'-':d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
    function renderRecent(rows){
      if(!rows||!rows.length){el('recent').innerHTML='<div class="empty">아직 체크인 기록이 없습니다.</div>';return;}
      el('recent').innerHTML='<table><thead><tr><th>신청자</th><th>시각</th><th>입장</th></tr></thead><tbody>'+rows.slice(0,8).map(r=>`<tr><td>${String(r.name||'-').replace(/[&<>]/g,'')}</td><td>${timeText(r.time)}</td><td>${nf(r.count)}명</td></tr>`).join('')+'</tbody></table>';
    }
    async function load(){
      try{
        const res=await fetch(`${API}?action=dashboard&_=${Date.now()}`,{cache:'no-store'}); if(!res.ok)throw new Error();
        const d=await res.json(); if(!d.ok)throw new Error();
        el('registrations').textContent=nf(d.registrations);el('expected').textContent=nf(d.expectedPeople);el('checkedPeople').textContent=nf(d.checkedPeople);el('remaining').textContent=nf(d.remainingRegistrations);el('checkedRegistrations').textContent=nf(d.checkedRegistrations);
        const rate=d.registrations?Math.round(d.checkedRegistrations/d.registrations*100):0;el('rate').textContent=rate+'%';el('bar').style.width=Math.min(100,rate)+'%';renderRecent(d.recent);
        el('status').className='status ok';el('status').lastElementChild.textContent='실시간 연결';el('updated').textContent='마지막 갱신 '+new Date().toLocaleTimeString('ko-KR');
      }catch(_){el('status').className='status bad';el('status').lastElementChild.textContent='연결 확인 필요';}
    }
    load();setInterval(load,5000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load();});
  </script>
</body>
</html>
