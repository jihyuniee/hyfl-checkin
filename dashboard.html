<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111f"><title>2차 입학설명회 현장 대시보드</title><style>:root{--bg:#09111f;--panel:#111d2e;--line:#22334a;--text:#f5f8fc;--muted:#91a0b5;--pink:#d7a4bd;--amber:#ffbd45;--green:#37d995;--red:#ff6f7d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#152744 0,#09111f 45%);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1220px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{margin:0 0 5px;font-size:clamp(23px,3vw,34px)}.sub{font-size:13px;color:var(--muted)}.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;color:#fff;text-decoration:none;background:rgba(255,255,255,.05);font-size:13px;font-weight:800}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;margin-bottom:13px;border:1px solid var(--line);border-radius:14px;background:rgba(17,29,46,.88);font-size:14px}.live{display:flex;align-items:center;gap:8px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.stamp{color:var(--muted)}.hero{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}.hero-card{padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#13243a,#101b2b)}.hero-label{color:var(--muted);font-size:15px;font-weight:800}.hero-value{margin-top:8px;font-size:clamp(48px,7vw,76px);line-height:1;font-weight:950}.hero-unit{font-size:20px;color:var(--muted);margin-left:7px}.green{color:var(--green)}.amber{color:var(--amber)}.progress-wrap{margin-top:18px}.progress{height:11px;background:#08111e;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#2387ec,var(--green));transition:width .25s}.progress-text{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--muted)}.section{margin-top:13px;padding:17px;border:1px solid var(--line);border-radius:20px;background:rgba(17,29,46,.9)}.section-title{margin:0 0 13px;font-size:15px;color:#c8d3e1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{min-height:112px;padding:16px;border-radius:15px;background:#0c1726;border:1px solid #1e3047}.label{min-height:35px;color:var(--muted);font-size:13px;font-weight:750}.value{margin-top:6px;font-size:clamp(27px,3.5vw,40px);font-weight:900}.unit{font-size:14px;color:var(--muted);margin-left:4px}.card.pink{border-top:4px solid var(--pink)}.card.attend{border-top:4px solid var(--amber)}.card.total{border-top:4px solid #69788c}.card.warn{border-top:4px solid var(--red)}.bottom{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px}.info{padding:17px;border-radius:15px;background:#0c1726;border:1px solid #1e3047}.info .value{font-size:30px}.state{display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:900}.error{display:none;padding:14px;margin-bottom:13px;border-radius:14px;border:1px solid rgba(255,111,125,.45);background:rgba(255,111,125,.12);color:#ffd9dd}@media(max-width:760px){main{padding:14px}.cards{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr 1fr}.bottom .state{grid-column:1/-1}.hero-value{font-size:50px}}</style></head><body><main><header class="top"><div><h1>현장 체크인 대시보드</h1><div class="sub">2027학년도 2차 입학설명회</div></div><a class="btn" href="index.html">체크인으로 돌아가기</a></header><div id="error" class="error"></div><div class="statusbar"><span class="live"><span class="dot"></span><span id="liveText">2초마다 자동 갱신</span></span><span class="stamp">마지막 갱신 <b id="updated">-</b></span></div><section class="hero"><article class="hero-card green"><div class="hero-label">총 출석 인원수</div><div class="hero-value"><span id="totalAttendedPeople">-</span><span class="hero-unit">명</span></div><div class="progress-wrap"><div class="progress"><div id="bar" class="bar"></div></div><div class="progress-text"><span id="rate">신청 대비 -%</span><span id="peopleGoal">신청 -명</span></div></div></article><article class="hero-card amber"><div class="hero-label">총 출석 가구수</div><div class="hero-value"><span id="totalAttendedHouseholds">-</span><span class="hero-unit">가구</span></div><div class="progress-wrap"><div class="progress"><div id="houseBar" class="bar"></div></div><div class="progress-text"><span id="houseRate">신청 대비 -%</span><span id="houseGoal">신청 -가구</span></div></div></article></section><section class="section"><h2 class="section-title">신청 및 출석 현황</h2><div class="cards"><article class="card pink"><div class="label">신청한 가구 수</div><div class="value"><span id="requestedHouseholds">-</span><span class="unit">가구</span></div></article><article class="card pink"><div class="label">신청 인원 수</div><div class="value"><span id="requestedPeople">-</span><span class="unit">명</span></div></article><article class="card attend"><div class="label">출석한 가구 수</div><div class="value amber"><span id="attendedHouseholds">-</span><span class="unit">가구</span></div></article><article class="card attend"><div class="label">출석 인원 수</div><div class="value amber"><span id="attendedPeople">-</span><span class="unit">명</span></div></article></div></section><section class="section"><h2 class="section-title">확인 필요</h2><div class="cards"><article class="card total"><div class="label">미등록 토큰 수</div><div class="value"><span id="unregisteredTokens">-</span><span class="unit">개</span></div></article><article class="card total"><div class="label">미등록 토큰 스캔 횟수</div><div class="value"><span id="unregisteredScans">-</span><span class="unit">회</span></div></article><article class="card warn"><div class="label">신청 vs 출석 인원 차이</div><div class="value"><span id="peopleDifference">-</span><span class="unit">명</span></div></article><article class="card warn"><div class="label">신청 vs 출석 가구 차이</div><div class="value"><span id="householdDifference">-</span><span class="unit">가구</span></div></article></div></section><section class="section bottom"><article class="info"><div class="label">마지막 스캔 시간</div><div class="value" id="lastScanAt">-</div></article><article class="info"><div class="label">데이터 상태</div><div class="value" id="dataStatus">-</div></article><article class="info state" id="stateText">데이터 연결 확인 중</article></section></main><script>const API='https://script.google.com/macros/s/AKfycbzGsYA6RRTntLKntkc61IrT6CU33TXO65LrNt-zwcbucM5njuqKJPU8HDSkHHUzB073/exec';const $=id=>document.getElementById(id),fmt=v=>Number(v||0).toLocaleString('ko-KR');const clock=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})};function normalize(d){if(d.requestedHouseholds==null&&d.registrations!=null)return{...d,requestedHouseholds:d.registrations,requestedPeople:d.expectedPeople,attendedHouseholds:d.checkedRegistrations,attendedPeople:d.checkedPeople,totalAttendedHouseholds:d.checkedRegistrations,totalAttendedPeople:d.checkedPeople,unregisteredTokens:d.invalidScans,unregisteredScans:d.invalidScans,peopleDifference:Math.max(0,(d.expectedPeople||0)-(d.checkedPeople||0)),householdDifference:Math.max(0,(d.registrations||0)-(d.checkedRegistrations||0)),status:d.lastScanAt?'정상':'—'};return d}function render(raw){const d=normalize(raw),ids=['requestedHouseholds','requestedPeople','attendedHouseholds','attendedPeople','totalAttendedHouseholds','totalAttendedPeople','unregisteredTokens','unregisteredScans','peopleDifference','householdDifference'];ids.forEach(id=>$(id).textContent=fmt(d[id]));const pr=d.requestedPeople?d.totalAttendedPeople/d.requestedPeople*100:0,hr=d.requestedHouseholds?d.totalAttendedHouseholds/d.requestedHouseholds*100:0;$('bar').style.width=Math.min(100,pr)+'%';$('houseBar').style.width=Math.min(100,hr)+'%';$('rate').textContent='신청 대비 '+pr.toFixed(1)+'%';$('houseRate').textContent='신청 대비 '+hr.toFixed(1)+'%';$('peopleGoal').textContent='신청 '+fmt(d.requestedPeople)+'명';$('houseGoal').textContent='신청 '+fmt(d.requestedHouseholds)+'가구';$('lastScanAt').textContent=clock(d.lastScanAt);$('dataStatus').textContent=d.status||'—';$('updated').textContent=clock(d.updatedAt||Date.now());$('stateText').textContent=d.lastScanAt?'정상 집계 중':'입장 시작 전';$('error').style.display='none';$('liveText').textContent='2초마다 자동 갱신'}let refreshing=false;async function refresh(){if(refreshing)return;refreshing=true;try{const r=await fetch(API+'?action=dashboard&_='+Date.now(),{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.msg||'집계 오류');render(d)}catch(e){$('error').style.display='block';$('error').textContent='대시보드 데이터를 불러오지 못했습니다.';$('liveText').textContent='연결 확인 필요'}finally{refreshing=false}}refresh();setInterval(refresh,2000);</script></body></html>
